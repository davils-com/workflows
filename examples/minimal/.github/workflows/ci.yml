name: CI

# Everything with the defaults: davils-com/workflows finds the packages and decides per event what
# runs. Add .github/davils-ci.yaml to change anything.

on:
  push:
    branches: ['**']
    tags: ['v*', '*-v*']
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]
  merge_group:
  schedule:
    # New vulnerabilities are published for dependencies nobody touched.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  pipeline:
    name: Pipeline
    uses: davils-com/workflows/.github/workflows/pipeline.yml@v1
    # GitHub checks the permissions of every job the pipeline could run before it starts, so it
    # needs all of them, even when a feature is off. examples/granular needs less.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: write
      security-events: write
      pages: write
      id-token: write
      attestations: write
    secrets: inherit
