name: GitHub release

# Creates or completes the GitHub release of a tag: release notes (Inspectra changelog notes, the
# CHANGELOG.md section, a file or GitHub's generated notes), every release-assets-* artifact of the
# run (native binaries, app builds), a checksums.txt over them and build provenance attestations.
#
# The caller grants contents: write, and id-token: write with attestations: write for the
# attestations.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the root pubspec.yaml, relative to the repository root.
        type: string
        default: .
      tag:
        description: The release tag; empty takes github.ref_name.
        type: string
        default: ''
      package:
        description: Name of the released package, for the release name.
        type: string
        default: ''
      package-path:
        description: Directory of the released package, relative to the working directory, for the release notes.
        type: string
        default: .
      version:
        description: The released version; empty reads it from the tag (the part after the last v).
        type: string
        default: ''
      name:
        description: Release name; {package}, {version} and {tag} are replaced. Empty names it "{package} {version}" in a workspace and "{version}" otherwise.
        type: string
        default: ''
      notes-source:
        description: auto (inspectra when the package has an Inspectra configuration, else the CHANGELOG.md section, else generated), inspectra, changelog, file, generate or keep (the body of an existing release, such as one of release-please).
        type: string
        default: auto
      notes-file:
        description: For notes-source file, the path relative to the working directory.
        type: string
        default: ''
      has-inspectra:
        description: true when the package has an Inspectra configuration (pipeline.yml passes it).
        type: boolean
        default: false
      inspectra-install:
        description: How Inspectra is installed for notes-source inspectra (auto, dev-dependency, global, binary).
        type: string
        default: auto
      assets-enabled:
        description: Attach the release-assets-* artifacts of the run.
        type: boolean
        default: true
      assets-pattern:
        description: Pattern of the artifacts to attach.
        type: string
        default: release-assets-*
      checksums:
        description: Attach a checksums.txt with the SHA-256 of every asset.
        type: boolean
        default: true
      attest:
        description: Attest the build provenance of every asset.
        type: boolean
        default: true
      prerelease:
        description: auto (when the version has a pre-release part), true or false.
        type: string
        default: auto
      make-latest:
        description: auto, true or false. auto marks it as latest unless it is a pre-release or a package release of a workspace other than latest-package.
        type: string
        default: auto
      latest-package:
        description: In a workspace, the package whose releases become the latest release.
        type: string
        default: ''
      draft:
        description: Create the release as a draft.
        type: boolean
        default: false
      mode:
        description: auto (complete an existing release, create one otherwise), create, update or skip.
        type: string
        default: auto
      sdk:
        description: Dart SDK for the Inspectra notes.
        type: string
        default: stable
      runners:
        description: JSON object of runner labels.
        type: string
        default: '{}'
      timeout-minutes:
        description: Timeout of the job.
        type: number
        default: 20
      harden-runner:
        description: Run step-security/harden-runner first.
        type: boolean
        default: true
      harden-runner-egress-policy:
        description: audit or block.
        type: string
        default: audit
      harden-runner-allowed-endpoints:
        description: Endpoints allowed with the block policy, space separated.
        type: string
        default: ''

    outputs:
      url:
        description: URL of the release.
        value: ${{ jobs.release.outputs.url }}

permissions: {}

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    if: inputs.mode != 'skip'
    runs-on: ${{ fromJSON(inputs.runners).linux || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    permissions:
      contents: write
      id-token: write
      attestations: write

    outputs:
      url: ${{ steps.release.outputs.url }}

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Harden the runner
        if: inputs.harden-runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.harden-runner-egress-policy }}
          allowed-endpoints: ${{ inputs.harden-runner-allowed-endpoints }}

      # The changelog check of Inspectra compares with earlier tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ (inputs.notes-source == 'inspectra' || inputs.has-inspectra) && '0' || '1' }}
          persist-credentials: false

      - name: Describe the release
        id: describe
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ inputs.name }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make-latest }}
          LATEST_PACKAGE: ${{ inputs.latest-package }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION_INPUT:-${TAG##*v}}"
          prerelease="$PRERELEASE"
          if [[ "$prerelease" == auto ]]; then
            [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          fi
          package_tag=false
          [[ "$TAG" == *-v* && -n "$PACKAGE" ]] && package_tag=true
          name="$NAME"
          if [[ -z "$name" ]]; then
            if [[ "$package_tag" == true ]]; then name='{package} {version}'; else name='{version}'; fi
          fi
          name="${name//\{package\}/$PACKAGE}"
          name="${name//\{version\}/$version}"
          name="${name//\{tag\}/$TAG}"
          latest="$MAKE_LATEST"
          if [[ "$latest" == auto ]]; then
            if [[ "$prerelease" == true ]]; then
              latest=false
            elif [[ "$package_tag" == true && -n "$LATEST_PACKAGE" && "$PACKAGE" != "$LATEST_PACKAGE" ]]; then
              latest=false
            else
              latest=true
            fi
          fi
          exists=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          if [[ "$MODE" == create && "$exists" == true ]]; then
            echo "::error::The release $TAG exists already; mode create does not change it."
            exit 1
          fi
          if [[ "$MODE" == update && "$exists" != true ]]; then
            echo "::error::The release $TAG does not exist; mode update only completes existing releases."
            exit 1
          fi
          {
            echo "version=$version"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "exists=$exists"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Dart
        if: inputs.notes-source == 'inspectra' || (inputs.notes-source == 'auto' && inputs.has-inspectra)
        uses: $/actions/setup-dart-env
        with:
          sdk: ${{ inputs.sdk }}
          working-directory: ${{ inputs.working-directory }}

      - name: Set up Inspectra
        id: inspectra
        if: inputs.notes-source == 'inspectra' || (inputs.notes-source == 'auto' && inputs.has-inspectra)
        uses: $/actions/inspectra-setup
        with:
          install: ${{ inputs.inspectra-install }}
          working-directory: ${{ inputs.working-directory }}
          trivy-cache: 'false'

      - name: Write the release notes
        id: notes
        uses: $/actions/release-notes
        with:
          source: ${{ (inputs.notes-source == 'auto' && steps.describe.outputs.exists == 'true' && 'keep') || inputs.notes-source }}
          package-path: ${{ inputs.package-path }}
          version: ${{ steps.describe.outputs.version }}
          file: ${{ inputs.notes-file }}
          inspectra-command: ${{ steps.inspectra.outputs.command }}
          has-inspectra: ${{ inputs.has-inspectra }}
          working-directory: ${{ inputs.working-directory }}

      - name: Download the assets
        if: inputs.assets-enabled
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.assets-pattern }}
          path: ${{ runner.temp }}/davils-assets
          merge-multiple: true

      - name: Write the checksums
        id: assets
        shell: bash
        env:
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          dir="$RUNNER_TEMP/davils-assets"
          mkdir -p "$dir"
          # The per-file .sha256 files are folded into checksums.txt.
          find "$dir" -name '*.sha256' -delete
          count="$(find "$dir" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$CHECKSUMS" == true && "$count" != 0 ]]; then
            sums="$(cd "$dir" && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum)"
            printf '%s\n' "$sums" >"$dir/checksums.txt"
            cat "$dir/checksums.txt"
          fi
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "directory=$dir" >>"$GITHUB_OUTPUT"

      - name: Attest the build provenance
        if: inputs.attest && steps.assets.outputs.count != '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.directory }}/*

      - name: Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.describe.outputs.name }}
          body_path: ${{ steps.notes.outputs.source != 'generate' && steps.notes.outputs.source != 'keep' && steps.notes.outputs.file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.source == 'generate' }}
          prerelease: ${{ steps.describe.outputs.prerelease }}
          make_latest: ${{ steps.describe.outputs.latest }}
          draft: ${{ inputs.draft }}
          files: ${{ steps.assets.outputs.count != '0' && format('{0}/*', steps.assets.outputs.directory) || '' }}
          fail_on_unmatched_files: false
