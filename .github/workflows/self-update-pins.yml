name: Self update pins

# Dependabot keeps the actions current. This workflow moves what Dependabot cannot see: the
# Writerside builder image and the versions of actionlint, zizmor and check-jsonschema that
# self-lint.yml installs. It opens a pull request into develop when something changed.
#
# Pull requests opened with the GITHUB_TOKEN start no workflows; with the secrets RELEASE_APP_ID
# and RELEASE_APP_PRIVATE_KEY the pull request comes from that GitHub App and is checked as usual.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: self-update-pins
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    name: Update the pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Create the app token
        id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: true

      - name: Update the pins
        id: update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          changes="$(bash tools/update-pins.sh)"
          {
            echo "changes<<davils_changes"
            echo "$changes"
            echo "davils_changes"
          } >>"$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.update.outputs.changes != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          CHANGES: ${{ steps.update.outputs.changes }}
        run: |
          branch="chore/update-pins-$(date -u +%Y%m%d)"
          git config user.name 'davils-ci'
          git config user.email 'davils-ci@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -am "chore(deps): update the pins Dependabot cannot see"
          git push --force origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore(deps): update the pins Dependabot cannot see" \
            --body "$(printf 'Updated by self-update-pins.yml:\n\n%s\n' "$CHANGES")" ||
            echo "The pull request exists already; its branch was updated."
