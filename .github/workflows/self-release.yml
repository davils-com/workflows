name: Self release

# Releases this repository: release-please keeps a release pull request on main open; merging it
# tags vX.Y.Z and creates the GitHub release. Then the major tag (v1) moves to the new release, so
# consumers pinned to @v1 get it, while @vX.Y.Z and @<sha> stay where they are.
#
# A tag ruleset protects v*.*.* from updates and deletion; the major tags are exempt so this
# workflow can move them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  major-tag:
    name: Move the major tag
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Move v${{ needs.release-please.outputs.major }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: v${{ needs.release-please.outputs.major }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" -f sha="$SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$SHA"
          fi
          echo "$MAJOR now points to $SHA."
